<text x="76" y="174.33" font-family="Inter" font-size="12.8" font-weight="700" fill="#c2c2c2" letter-spacing="1.02">CATERING PARA EMPRESAS</text>
<text x="76" y="240.91" font-family="Inter" font-size="57.6" font-weight="500" fill="#ffffff">Tu próxima reunión,</text>
<text x="76" y="310.02" font-family="Inter" font-size="57.6" font-weight="500" fill="#ffffff">resuelta en un solo</text>
<text x="76" y="379.13" font-family="Inter" font-size="57.6" font-weight="500" fill="#ffffff">pedido.</text>
<text x="76" y="442.03" font-family="Inter" font-size="18.4" font-weight="400" fill="#f4f4f4">Elegí el menú, indicá la fecha y la cantidad de personas, y</text>
<text x="76" y="471.47" font-family="Inter" font-size="18.4" font-weight="400" fill="#f4f4f4">obtené al instante un precio estimado. Nosotros nos ocupamos</text>
<text x="76" y="500.91" font-family="Inter" font-size="18.4" font-weight="400" fill="#f4f4f4">del resto.</text>
