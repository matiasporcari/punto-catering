<text x="76" y="840.84" font-family="Inter" font-size="32" font-weight="400" fill="#666666">1</text>
<text x="76" y="870.64" font-family="Inter" font-size="18.4" font-weight="500" fill="#323232">Armás tu pedido</text>
<text x="76" y="902.91" font-family="Inter" font-size="16" font-weight="400" fill="#252525">Elegís uno o más menús y ves el precio</text>
<text x="76" y="928.5" font-family="Inter" font-size="16" font-weight="400" fill="#252525">estimado mientras completás los datos.</text>
<rect x="462.66" y="795.64" width="354.67" height="2" fill="#323232"/>
<text x="462.66" y="840.84" font-family="Inter" font-size="32" font-weight="400" fill="#666666">2</text>
<text x="462.66" y="870.64" font-family="Inter" font-size="18.4" font-weight="500" fill="#323232">Recibís el presupuesto</text>
<text x="462.66" y="902.91" font-family="Inter" font-size="16" font-weight="400" fill="#252525">Revisamos el pedido y publicamos el precio</text>
<text x="462.66" y="928.5" font-family="Inter" font-size="16" font-weight="400" fill="#252525">final en tu cuenta, listo para imprimir.</text>
<rect x="849.33" y="795.64" width="354.66" height="2" fill="#323232"/>
<text x="849.33" y="840.84" font-family="Inter" font-size="32" font-weight="400" fill="#666666">3</text>
<text x="849.33" y="870.64" font-family="Inter" font-size="18.4" font-weight="500" fill="#323232">Lo confirmás con un clic</text>
<text x="849.33" y="902.91" font-family="Inter" font-size="16" font-weight="400" fill="#252525">Aprobás desde tu cuenta y llegamos con todo</text>
<text x="849.33" y="928.5" font-family="Inter" font-size="16" font-weight="400" fill="#252525">preparado el día del evento.</text>
