<text x="16" y="25.08" font-family="Inter" font-size="22.4" font-weight="700" fill="#323232">Punto Catering</text>
<text x="185.38" y="25.08" font-family="Inter" font-size="22.4" font-weight="700" fill="#666666">.</text>
<rect x="325" y="10" width="24" height="2" fill="#323232"/>
<rect x="325" y="17" width="24" height="2" fill="#323232"/>
<rect x="325" y="24" width="24" height="2" fill="#323232"/>
<rect x="16" y="36" width="343" height="243.95" fill="#ffffff"/>
<text x="16" y="62" font-family="Inter" font-size="16" font-weight="500" fill="#252525">Inicio</text>
<text x="16" y="107.59" font-family="Inter" font-size="16" font-weight="500" fill="#252525">Catálogo</text>
<text x="16" y="153.19" font-family="Inter" font-size="16" font-weight="500" fill="#252525">Contacto</text>
<text x="16" y="198.78" font-family="Inter" font-size="16" font-weight="500" fill="#252525">Ingresar</text>
<rect x="16" y="218.38" width="343" height="45.58" rx="8" fill="#666666"/>
<text x="115.59" y="245.77" font-family="Inter" font-size="16" font-weight="700" fill="#ffffff">Pedir presupuesto</text>
<rect x="0" y="280.95" width="375" height="504.05" fill="#323232"/>
<text x="16" y="334.95" font-family="Inter" font-size="12.8" font-weight="700" fill="#c2c2c2" letter-spacing="1.02">CATERING PARA EMPRESAS</text>
<text x="16" y="379.53" font-family="Inter" font-size="35.2" font-weight="500" fill="#ffffff">Tu próxima reunión,</text>
<text x="16" y="421.77" font-family="Inter" font-size="35.2" font-weight="500" fill="#ffffff">resuelta en un solo</text>
<text x="16" y="464" font-family="Inter" font-size="35.2" font-weight="500" fill="#ffffff">pedido.</text>
<text x="16" y="510.83" font-family="Inter" font-size="18.4" font-weight="400" fill="#f4f4f4">Elegí el menú, indicá la fecha y la</text>
<text x="16" y="540.27" font-family="Inter" font-size="18.4" font-weight="400" fill="#f4f4f4">cantidad de personas, y obtené al</text>
<text x="16" y="569.7" font-family="Inter" font-size="18.4" font-weight="400" fill="#f4f4f4">instante un precio estimado. Nosotros</text>
<text x="16" y="599.14" font-family="Inter" font-size="18.4" font-weight="400" fill="#f4f4f4">nos ocupamos del resto.</text>
<rect x="16" y="626.97" width="256.28" height="53.02" rx="8" fill="#666666"/>
<text x="43.59" y="658.56" font-family="Inter" font-size="16.8" font-weight="700" fill="#ffffff">Obtener mi presupuesto</text>
<rect x="17" y="692.98" width="174.69" height="51.02" rx="8" fill="#ffffff" stroke="#d2d2d2" stroke-width="2"/>
<text x="43.59" y="723.58" font-family="Inter" font-size="16.8" font-weight="700" fill="#323232">Ver el catálogo</text>
<text x="16" y="838" font-family="Inter" font-size="22.4" font-weight="500" fill="#323232">Cómo funciona</text>
<rect x="16" y="867.88" width="343" height="2" fill="#323232"/>
<text x="16" y="913.08" font-family="Inter" font-size="32" font-weight="400" fill="#666666">1</text>
<text x="16" y="942.88" font-family="Inter" font-size="18.4" font-weight="500" fill="#323232">Armás tu pedido</text>
<text x="16" y="975.14" font-family="Inter" font-size="16" font-weight="400" fill="#252525">Elegís uno o más menús y ves el precio</text>
<text x="16" y="1000.73" font-family="Inter" font-size="16" font-weight="400" fill="#252525">estimado mientras completás los datos.</text>
<rect x="16" y="1044.33" width="343" height="2" fill="#323232"/>
<text x="16" y="1089.53" font-family="Inter" font-size="32" font-weight="400" fill="#666666">2</text>
<text x="16" y="1119.33" font-family="Inter" font-size="18.4" font-weight="500" fill="#323232">Recibís el presupuesto</text>
<text x="16" y="1151.59" font-family="Inter" font-size="16" font-weight="400" fill="#252525">Revisamos el pedido y publicamos el precio</text>
<text x="16" y="1177.19" font-family="Inter" font-size="16" font-weight="400" fill="#252525">final en tu cuenta, listo para imprimir.</text>
<rect x="16" y="1220.78" width="343" height="2" fill="#323232"/>
<text x="16" y="1265.98" font-family="Inter" font-size="32" font-weight="400" fill="#666666">3</text>
<text x="16" y="1295.78" font-family="Inter" font-size="18.4" font-weight="500" fill="#323232">Lo confirmás con un clic</text>
<text x="16" y="1328.05" font-family="Inter" font-size="16" font-weight="400" fill="#252525">Aprobás desde tu cuenta y llegamos con todo</text>
<text x="16" y="1353.64" font-family="Inter" font-size="16" font-weight="400" fill="#252525">preparado el día del evento.</text>
<rect x="0" y="1409.23" width="375" height="1538.7" fill="#e8e8e8"/>
<text x="16" y="1462.23" font-family="Inter" font-size="22.4" font-weight="500" fill="#323232">Los más elegidos</text>
<text x="16" y="1498.11" font-family="Inter" font-size="16" font-weight="400" fill="#666666">Ver todos los menús</text>
<rect x="16.5" y="1526.2" width="342" height="449.08" rx="10" fill="#ffffff" stroke="#d2d2d2" stroke-width="1"/>
<rect x="17" y="1526.7" width="341" height="204.59" fill="#d8d8d8" stroke="#8a8a8a"/>
<path d="M17 1526.7L358 1731.3M358 1526.7L17 1731.3" stroke="#8a8a8a" fill="none"/>
<text x="37" y="1762.89" font-family="Inter" font-size="12.8" font-weight="700" fill="#666666" letter-spacing="1.02">ALMUERZO DE TRABAJO</text>
<text x="37" y="1791.47" font-family="Inter" font-size="18.4" font-weight="500" fill="#323232">Box ejecutivo</text>
<text x="37" y="1822.73" font-family="Inter" font-size="15.2" font-weight="400" fill="#5e5e5e">Vianda individual con plato principal del</text>
<text x="37" y="1847.05" font-family="Inter" font-size="15.2" font-weight="400" fill="#5e5e5e">día, ensalada, postre y agua saborizada.</text>
<rect x="37" y="1869.55" width="127.8" height="23.66" rx="11.83" fill="#e8e8e8"/>
<text x="46.59" y="1885.14" font-family="Inter" font-size="12.8" font-weight="500" fill="#5e5e5e">Desde 5 personas</text>
<text x="37" y="1928.88" font-family="Inter" font-size="19.2" font-weight="700" fill="#323232">$ 18.500</text>
<text x="37" y="1948.91" font-family="Inter" font-size="12.8" font-weight="400" fill="#5e5e5e">por persona</text>
<rect x="165.97" y="1910.2" width="171.03" height="43.58" rx="8" fill="none" stroke="#4d4d4d" stroke-width="2"/>
<text x="186.16" y="1936.59" font-family="Inter" font-size="16" font-weight="700" fill="#323232">Lo quiero cotizar</text>
<rect x="16.5" y="1996.28" width="342" height="449.08" rx="10" fill="#ffffff" stroke="#d2d2d2" stroke-width="1"/>
<rect x="17" y="1996.78" width="341" height="204.59" fill="#d8d8d8" stroke="#8a8a8a"/>
<path d="M17 1996.78L358 2201.38M358 1996.78L17 2201.38" stroke="#8a8a8a" fill="none"/>
<text x="37" y="2232.97" font-family="Inter" font-size="12.8" font-weight="700" fill="#666666" letter-spacing="1.02">EVENTO CORPORATIVO</text>
<text x="37" y="2261.55" font-family="Inter" font-size="18.4" font-weight="500" fill="#323232">Buffet aniversario</text>
<text x="37" y="2292.81" font-family="Inter" font-size="15.2" font-weight="400" fill="#5e5e5e">Mesa de entradas, dos platos principales,</text>
<text x="37" y="2317.13" font-family="Inter" font-size="15.2" font-weight="400" fill="#5e5e5e">mesa dulce y bebidas. Incluye mozos.</text>
<rect x="37" y="2339.63" width="136.41" height="23.66" rx="11.83" fill="#e8e8e8"/>
<text x="46.59" y="2355.22" font-family="Inter" font-size="12.8" font-weight="500" fill="#5e5e5e">Desde 30 personas</text>
<text x="37" y="2398.95" font-family="Inter" font-size="19.2" font-weight="700" fill="#323232">$ 34.000</text>
<text x="37" y="2418.98" font-family="Inter" font-size="12.8" font-weight="400" fill="#5e5e5e">por persona</text>
<rect x="165.97" y="2380.28" width="171.03" height="43.58" rx="8" fill="none" stroke="#4d4d4d" stroke-width="2"/>
<text x="186.16" y="2406.67" font-family="Inter" font-size="16" font-weight="700" fill="#323232">Lo quiero cotizar</text>
<rect x="16.5" y="2466.36" width="342" height="449.08" rx="10" fill="#ffffff" stroke="#d2d2d2" stroke-width="1"/>
<rect x="17" y="2466.86" width="341" height="204.59" fill="#d8d8d8" stroke="#8a8a8a"/>
<path d="M17 2466.86L358 2671.45M358 2466.86L17 2671.45" stroke="#8a8a8a" fill="none"/>
<text x="37" y="2703.05" font-family="Inter" font-size="12.8" font-weight="700" fill="#666666" letter-spacing="1.02">COFFEE BREAK</text>
<text x="37" y="2731.63" font-family="Inter" font-size="18.4" font-weight="500" fill="#323232">Café clásico</text>
<text x="37" y="2762.89" font-family="Inter" font-size="15.2" font-weight="400" fill="#5e5e5e">Café de especialidad, té, jugo de naranja,</text>
<text x="37" y="2787.2" font-family="Inter" font-size="15.2" font-weight="400" fill="#5e5e5e">medialunas y budines caseros.</text>
<rect x="37" y="2809.7" width="91.44" height="23.66" rx="11.83" fill="#e9e9e9"/>
<text x="46.59" y="2825.3" font-family="Inter" font-size="12.8" font-weight="500" fill="#323232">Vegetariano</text>
<rect x="134.83" y="2809.7" width="132.98" height="23.66" rx="11.83" fill="#e8e8e8"/>
<text x="144.42" y="2825.3" font-family="Inter" font-size="12.8" font-weight="500" fill="#5e5e5e">Desde 10 personas</text>
<text x="37" y="2869.03" font-family="Inter" font-size="19.2" font-weight="700" fill="#323232">$ 9.500</text>
<text x="37" y="2889.06" font-family="Inter" font-size="12.8" font-weight="400" fill="#5e5e5e">por persona</text>
<rect x="165.97" y="2850.36" width="171.03" height="43.58" rx="8" fill="none" stroke="#4d4d4d" stroke-width="2"/>
<text x="186.16" y="2876.75" font-family="Inter" font-size="16" font-weight="700" fill="#323232">Lo quiero cotizar</text>
<text x="16" y="3000.94" font-family="Inter" font-size="22.4" font-weight="500" fill="#323232">Una propuesta para cada</text>
<text x="16" y="3027.81" font-family="Inter" font-size="22.4" font-weight="500" fill="#323232">ocasión</text>
<rect x="16" y="3057.69" width="343" height="119.89" rx="10" fill="#e9e9e9"/>
<text x="36" y="3094.69" font-family="Inter" font-size="18.4" font-weight="500" fill="#323232">Almuerzo de trabajo</text>
<text x="36" y="3125.95" font-family="Inter" font-size="15.2" font-weight="400" fill="#252525">Viandas y platos para almorzar en la</text>
<text x="36" y="3150.27" font-family="Inter" font-size="15.2" font-weight="400" fill="#252525">oficina.</text>
<rect x="16" y="3193.58" width="343" height="119.89" rx="10" fill="#e9e9e9"/>
<text x="36" y="3230.58" font-family="Inter" font-size="18.4" font-weight="500" fill="#323232">Cóctel</text>
<text x="36" y="3261.84" font-family="Inter" font-size="15.2" font-weight="400" fill="#252525">Bocados y bebidas para lanzamientos y</text>
<text x="36" y="3286.16" font-family="Inter" font-size="15.2" font-weight="400" fill="#252525">encuentros de equipo.</text>
<rect x="16" y="3329.47" width="343" height="119.89" rx="10" fill="#e9e9e9"/>
<text x="36" y="3366.47" font-family="Inter" font-size="18.4" font-weight="500" fill="#323232">Coffee break</text>
<text x="36" y="3397.73" font-family="Inter" font-size="15.2" font-weight="400" fill="#252525">Pausas de café para reuniones,</text>
<text x="36" y="3422.05" font-family="Inter" font-size="15.2" font-weight="400" fill="#252525">capacitaciones y jornadas.</text>
<rect x="16" y="3465.36" width="343" height="119.89" rx="10" fill="#e9e9e9"/>
<text x="36" y="3502.36" font-family="Inter" font-size="18.4" font-weight="500" fill="#323232">Evento corporativo</text>
<text x="36" y="3533.63" font-family="Inter" font-size="15.2" font-weight="400" fill="#252525">Propuestas completas para aniversarios y</text>
<text x="36" y="3557.94" font-family="Inter" font-size="15.2" font-weight="400" fill="#252525">cierres de año.</text>
<rect x="0" y="3617.25" width="375" height="239.08" fill="#e8e8e8"/>
<text x="16" y="3678.25" font-family="Inter" font-size="22.4" font-weight="500" fill="#323232">¿Tenés un evento en mente?</text>
<text x="16" y="3706.13" font-family="Inter" font-size="16" font-weight="400" fill="#252525">Conocé el precio estimado en menos de dos</text>
<text x="16" y="3731.72" font-family="Inter" font-size="16" font-weight="400" fill="#252525">minutos, sin compromiso.</text>
<rect x="16" y="3763.31" width="256.28" height="53.02" rx="8" fill="#666666"/>
<text x="43.59" y="3794.91" font-family="Inter" font-size="16.8" font-weight="700" fill="#ffffff">Obtener mi presupuesto</text>
<rect x="0" y="3856.33" width="375" height="372.03" fill="#323232"/>
<text x="16" y="3921.33" font-family="Inter" font-size="22.4" font-weight="700" fill="#f4f4f4">Punto Catering</text>
<text x="185.38" y="3921.33" font-family="Inter" font-size="22.4" font-weight="700" fill="#a9a9a9">.</text>
<text x="16" y="3958.17" font-family="Inter" font-size="16" font-weight="400" fill="#f4f4f4">Catering para empresas, de la pausa de café a</text>
<text x="16" y="3983.77" font-family="Inter" font-size="16" font-weight="400" fill="#f4f4f4">la cena de fin de año.</text>
<text x="16" y="4041.36" font-family="Inter" font-size="16" font-weight="400" fill="#f4f4f4">Catálogo</text>
<text x="16" y="4072.55" font-family="Inter" font-size="16" font-weight="400" fill="#f4f4f4">Pedir presupuesto</text>
<text x="16" y="4103.73" font-family="Inter" font-size="16" font-weight="400" fill="#f4f4f4">Contacto</text>
<text x="16" y="4151.33" font-family="Inter" font-size="14.08" font-weight="400" fill="#f4f4f4">Trabajo final de Programación Web - UCH</text>
<text x="16" y="4173.84" font-family="Inter" font-size="14.08" font-weight="400" fill="#f4f4f4">Bautista Navarro y Matias Porcari</text>
