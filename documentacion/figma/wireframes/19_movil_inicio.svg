<svg xmlns="http://www.w3.org/2000/svg" width="375" height="4016" viewBox="0 0 375 4016" fill="none">
<rect width="375" height="4016" fill="#f4f4f4"/>
<rect x="0" y="0" width="375" height="4016.41" fill="#f4f4f4"/>
<rect x="0" y="0" width="375" height="69" fill="#ffffff"/>
<rect x="0" y="68" width="375" height="1" fill="#d2d2d2"/>
<text x="16" y="41.08" font-family="Inter" font-size="22.4" font-weight="700" fill="#323232">Punto Catering</text>
<text x="185.38" y="41.08" font-family="Inter" font-size="22.4" font-weight="700" fill="#666666">.</text>
<rect x="325" y="26" width="24" height="2" fill="#323232"/>
<rect x="325" y="33" width="24" height="2" fill="#323232"/>
<rect x="325" y="40" width="24" height="2" fill="#323232"/>
<rect x="0" y="69" width="375" height="504.05" fill="#323232"/>
<text x="16" y="123" font-family="Inter" font-size="12.8" font-weight="700" fill="#c2c2c2" letter-spacing="1.02">CATERING PARA EMPRESAS</text>
<text x="16" y="167.58" font-family="Inter" font-size="35.2" font-weight="500" fill="#ffffff">Tu próxima reunión,</text>
<text x="16" y="209.81" font-family="Inter" font-size="35.2" font-weight="500" fill="#ffffff">resuelta en un solo</text>
<text x="16" y="252.05" font-family="Inter" font-size="35.2" font-weight="500" fill="#ffffff">pedido.</text>
<text x="16" y="298.88" font-family="Inter" font-size="18.4" font-weight="400" fill="#f4f4f4">Elegí el menú, indicá la fecha y la</text>
<text x="16" y="328.31" font-family="Inter" font-size="18.4" font-weight="400" fill="#f4f4f4">cantidad de personas, y obtené al</text>
<text x="16" y="357.75" font-family="Inter" font-size="18.4" font-weight="400" fill="#f4f4f4">instante un precio estimado. Nosotros</text>
<text x="16" y="387.19" font-family="Inter" font-size="18.4" font-weight="400" fill="#f4f4f4">nos ocupamos del resto.</text>
<rect x="16" y="415.02" width="256.28" height="53.02" rx="8" fill="#666666"/>
<text x="43.59" y="446.61" font-family="Inter" font-size="16.8" font-weight="700" fill="#ffffff">Obtener mi presupuesto</text>
<rect x="17" y="481.03" width="174.69" height="51.02" rx="8" fill="#ffffff" stroke="#d2d2d2" stroke-width="2"/>
<text x="43.59" y="511.63" font-family="Inter" font-size="16.8" font-weight="700" fill="#323232">Ver el catálogo</text>
<text x="16" y="626.05" font-family="Inter" font-size="22.4" font-weight="500" fill="#323232">Cómo funciona</text>
<rect x="16" y="655.92" width="343" height="2" fill="#323232"/>
<text x="16" y="701.12" font-family="Inter" font-size="32" font-weight="400" fill="#666666">1</text>
<text x="16" y="730.92" font-family="Inter" font-size="18.4" font-weight="500" fill="#323232">Armás tu pedido</text>
<text x="16" y="763.19" font-family="Inter" font-size="16" font-weight="400" fill="#252525">Elegís uno o más menús y ves el precio</text>
<text x="16" y="788.78" font-family="Inter" font-size="16" font-weight="400" fill="#252525">estimado mientras completás los datos.</text>
<rect x="16" y="832.38" width="343" height="2" fill="#323232"/>
<text x="16" y="877.58" font-family="Inter" font-size="32" font-weight="400" fill="#666666">2</text>
<text x="16" y="907.38" font-family="Inter" font-size="18.4" font-weight="500" fill="#323232">Recibís el presupuesto</text>
<text x="16" y="939.64" font-family="Inter" font-size="16" font-weight="400" fill="#252525">Revisamos el pedido y publicamos el precio</text>
<text x="16" y="965.23" font-family="Inter" font-size="16" font-weight="400" fill="#252525">final en tu cuenta, listo para imprimir.</text>
<rect x="16" y="1008.83" width="343" height="2" fill="#323232"/>
<text x="16" y="1054.03" font-family="Inter" font-size="32" font-weight="400" fill="#666666">3</text>
<text x="16" y="1083.83" font-family="Inter" font-size="18.4" font-weight="500" fill="#323232">Lo confirmás con un clic</text>
<text x="16" y="1116.09" font-family="Inter" font-size="16" font-weight="400" fill="#252525">Aprobás desde tu cuenta y llegamos con todo</text>
<text x="16" y="1141.69" font-family="Inter" font-size="16" font-weight="400" fill="#252525">preparado el día del evento.</text>
<rect x="0" y="1197.28" width="375" height="1538.7" fill="#e8e8e8"/>
<text x="16" y="1250.28" font-family="Inter" font-size="22.4" font-weight="500" fill="#323232">Los más elegidos</text>
<text x="16" y="1286.16" font-family="Inter" font-size="16" font-weight="400" fill="#666666">Ver todos los menús</text>
<rect x="16.5" y="1314.25" width="342" height="449.08" rx="10" fill="#ffffff" stroke="#d2d2d2" stroke-width="1"/>
<rect x="17" y="1314.75" width="341" height="204.59" fill="#d8d8d8" stroke="#8a8a8a"/>
<path d="M17 1314.75L358 1519.34M358 1314.75L17 1519.34" stroke="#8a8a8a" fill="none"/>
<text x="37" y="1550.94" font-family="Inter" font-size="12.8" font-weight="700" fill="#666666" letter-spacing="1.02">ALMUERZO DE TRABAJO</text>
<text x="37" y="1579.52" font-family="Inter" font-size="18.4" font-weight="500" fill="#323232">Box ejecutivo</text>
<text x="37" y="1610.78" font-family="Inter" font-size="15.2" font-weight="400" fill="#5e5e5e">Vianda individual con plato principal del</text>
<text x="37" y="1635.09" font-family="Inter" font-size="15.2" font-weight="400" fill="#5e5e5e">día, ensalada, postre y agua saborizada.</text>
<rect x="37" y="1657.59" width="127.8" height="23.66" rx="11.83" fill="#e8e8e8"/>
<text x="46.59" y="1673.19" font-family="Inter" font-size="12.8" font-weight="500" fill="#5e5e5e">Desde 5 personas</text>
<text x="37" y="1716.92" font-family="Inter" font-size="19.2" font-weight="700" fill="#323232">$ 18.500</text>
<text x="37" y="1736.95" font-family="Inter" font-size="12.8" font-weight="400" fill="#5e5e5e">por persona</text>
<rect x="165.97" y="1698.25" width="171.03" height="43.58" rx="8" fill="none" stroke="#4d4d4d" stroke-width="2"/>
<text x="186.16" y="1724.64" font-family="Inter" font-size="16" font-weight="700" fill="#323232">Lo quiero cotizar</text>
<rect x="16.5" y="1784.33" width="342" height="449.08" rx="10" fill="#ffffff" stroke="#d2d2d2" stroke-width="1"/>
<rect x="17" y="1784.83" width="341" height="204.59" fill="#d8d8d8" stroke="#8a8a8a"/>
<path d="M17 1784.83L358 1989.42M358 1784.83L17 1989.42" stroke="#8a8a8a" fill="none"/>
<text x="37" y="2021.02" font-family="Inter" font-size="12.8" font-weight="700" fill="#666666" letter-spacing="1.02">EVENTO CORPORATIVO</text>
<text x="37" y="2049.59" font-family="Inter" font-size="18.4" font-weight="500" fill="#323232">Buffet aniversario</text>
<text x="37" y="2080.86" font-family="Inter" font-size="15.2" font-weight="400" fill="#5e5e5e">Mesa de entradas, dos platos principales,</text>
<text x="37" y="2105.17" font-family="Inter" font-size="15.2" font-weight="400" fill="#5e5e5e">mesa dulce y bebidas. Incluye mozos.</text>
<rect x="37" y="2127.67" width="136.41" height="23.66" rx="11.83" fill="#e8e8e8"/>
<text x="46.59" y="2143.27" font-family="Inter" font-size="12.8" font-weight="500" fill="#5e5e5e">Desde 30 personas</text>
<text x="37" y="2187" font-family="Inter" font-size="19.2" font-weight="700" fill="#323232">$ 34.000</text>
<text x="37" y="2207.03" font-family="Inter" font-size="12.8" font-weight="400" fill="#5e5e5e">por persona</text>
<rect x="165.97" y="2168.33" width="171.03" height="43.58" rx="8" fill="none" stroke="#4d4d4d" stroke-width="2"/>
<text x="186.16" y="2194.72" font-family="Inter" font-size="16" font-weight="700" fill="#323232">Lo quiero cotizar</text>
<rect x="16.5" y="2254.41" width="342" height="449.08" rx="10" fill="#ffffff" stroke="#d2d2d2" stroke-width="1"/>
<rect x="17" y="2254.91" width="341" height="204.59" fill="#d8d8d8" stroke="#8a8a8a"/>
<path d="M17 2254.91L358 2459.5M358 2254.91L17 2459.5" stroke="#8a8a8a" fill="none"/>
<text x="37" y="2491.09" font-family="Inter" font-size="12.8" font-weight="700" fill="#666666" letter-spacing="1.02">COFFEE BREAK</text>
<text x="37" y="2519.67" font-family="Inter" font-size="18.4" font-weight="500" fill="#323232">Café clásico</text>
<text x="37" y="2550.94" font-family="Inter" font-size="15.2" font-weight="400" fill="#5e5e5e">Café de especialidad, té, jugo de naranja,</text>
<text x="37" y="2575.25" font-family="Inter" font-size="15.2" font-weight="400" fill="#5e5e5e">medialunas y budines caseros.</text>
<rect x="37" y="2597.75" width="91.44" height="23.66" rx="11.83" fill="#e9e9e9"/>
<text x="46.59" y="2613.34" font-family="Inter" font-size="12.8" font-weight="500" fill="#323232">Vegetariano</text>
<rect x="134.83" y="2597.75" width="132.98" height="23.66" rx="11.83" fill="#e8e8e8"/>
<text x="144.42" y="2613.34" font-family="Inter" font-size="12.8" font-weight="500" fill="#5e5e5e">Desde 10 personas</text>
<text x="37" y="2657.08" font-family="Inter" font-size="19.2" font-weight="700" fill="#323232">$ 9.500</text>
<text x="37" y="2677.11" font-family="Inter" font-size="12.8" font-weight="400" fill="#5e5e5e">por persona</text>
<rect x="165.97" y="2638.41" width="171.03" height="43.58" rx="8" fill="none" stroke="#4d4d4d" stroke-width="2"/>
<text x="186.16" y="2664.8" font-family="Inter" font-size="16" font-weight="700" fill="#323232">Lo quiero cotizar</text>
<text x="16" y="2788.98" font-family="Inter" font-size="22.4" font-weight="500" fill="#323232">Una propuesta para cada</text>
<text x="16" y="2815.86" font-family="Inter" font-size="22.4" font-weight="500" fill="#323232">ocasión</text>
<rect x="16" y="2845.73" width="343" height="119.89" rx="10" fill="#e9e9e9"/>
<text x="36" y="2882.73" font-family="Inter" font-size="18.4" font-weight="500" fill="#323232">Almuerzo de trabajo</text>
<text x="36" y="2914" font-family="Inter" font-size="15.2" font-weight="400" fill="#252525">Viandas y platos para almorzar en la</text>
<text x="36" y="2938.31" font-family="Inter" font-size="15.2" font-weight="400" fill="#252525">oficina.</text>
<rect x="16" y="2981.63" width="343" height="119.89" rx="10" fill="#e9e9e9"/>
<text x="36" y="3018.63" font-family="Inter" font-size="18.4" font-weight="500" fill="#323232">Cóctel</text>
<text x="36" y="3049.89" font-family="Inter" font-size="15.2" font-weight="400" fill="#252525">Bocados y bebidas para lanzamientos y</text>
<text x="36" y="3074.2" font-family="Inter" font-size="15.2" font-weight="400" fill="#252525">encuentros de equipo.</text>
<rect x="16" y="3117.52" width="343" height="119.89" rx="10" fill="#e9e9e9"/>
<text x="36" y="3154.52" font-family="Inter" font-size="18.4" font-weight="500" fill="#323232">Coffee break</text>
<text x="36" y="3185.78" font-family="Inter" font-size="15.2" font-weight="400" fill="#252525">Pausas de café para reuniones,</text>
<text x="36" y="3210.09" font-family="Inter" font-size="15.2" font-weight="400" fill="#252525">capacitaciones y jornadas.</text>
<rect x="16" y="3253.41" width="343" height="119.89" rx="10" fill="#e9e9e9"/>
<text x="36" y="3290.41" font-family="Inter" font-size="18.4" font-weight="500" fill="#323232">Evento corporativo</text>
<text x="36" y="3321.67" font-family="Inter" font-size="15.2" font-weight="400" fill="#252525">Propuestas completas para aniversarios y</text>
<text x="36" y="3345.98" font-family="Inter" font-size="15.2" font-weight="400" fill="#252525">cierres de año.</text>
<rect x="0" y="3405.3" width="375" height="239.08" fill="#e8e8e8"/>
<text x="16" y="3466.3" font-family="Inter" font-size="22.4" font-weight="500" fill="#323232">¿Tenés un evento en mente?</text>
<text x="16" y="3494.17" font-family="Inter" font-size="16" font-weight="400" fill="#252525">Conocé el precio estimado en menos de dos</text>
<text x="16" y="3519.77" font-family="Inter" font-size="16" font-weight="400" fill="#252525">minutos, sin compromiso.</text>
<rect x="16" y="3551.36" width="256.28" height="53.02" rx="8" fill="#666666"/>
<text x="43.59" y="3582.95" font-family="Inter" font-size="16.8" font-weight="700" fill="#ffffff">Obtener mi presupuesto</text>
<rect x="0" y="3644.38" width="375" height="372.03" fill="#323232"/>
<text x="16" y="3709.38" font-family="Inter" font-size="22.4" font-weight="700" fill="#f4f4f4">Punto Catering</text>
<text x="185.38" y="3709.38" font-family="Inter" font-size="22.4" font-weight="700" fill="#a9a9a9">.</text>
<text x="16" y="3746.22" font-family="Inter" font-size="16" font-weight="400" fill="#f4f4f4">Catering para empresas, de la pausa de café a</text>
<text x="16" y="3771.81" font-family="Inter" font-size="16" font-weight="400" fill="#f4f4f4">la cena de fin de año.</text>
<text x="16" y="3829.41" font-family="Inter" font-size="16" font-weight="400" fill="#f4f4f4">Catálogo</text>
<text x="16" y="3860.59" font-family="Inter" font-size="16" font-weight="400" fill="#f4f4f4">Pedir presupuesto</text>
<text x="16" y="3891.78" font-family="Inter" font-size="16" font-weight="400" fill="#f4f4f4">Contacto</text>
<text x="16" y="3939.38" font-family="Inter" font-size="14.08" font-weight="400" fill="#f4f4f4">Trabajo final de Programación Web - UCH</text>
<text x="16" y="3961.89" font-family="Inter" font-size="14.08" font-weight="400" fill="#f4f4f4">Bautista Navarro y Matias Porcari</text>
