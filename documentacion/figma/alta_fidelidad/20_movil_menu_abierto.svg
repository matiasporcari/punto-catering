<text x="16" y="334.95" font-family="DM Sans" font-size="12.8" font-weight="700" fill="#f0b48f" letter-spacing="1.02">CATERING PARA EMPRESAS</text>
<text x="16" y="379.53" font-family="Fraunces" font-size="35.2" font-weight="500" fill="#ffffff">Tu próxima reunión,</text>
<text x="16" y="421.77" font-family="Fraunces" font-size="35.2" font-weight="500" fill="#ffffff">resuelta en un solo</text>
<text x="16" y="464" font-family="Fraunces" font-size="35.2" font-weight="500" fill="#ffffff">pedido.</text>
