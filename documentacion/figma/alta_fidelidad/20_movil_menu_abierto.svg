<text x="16" y="540.27" font-family="DM Sans" font-size="18.4" font-weight="400" fill="#f8f4eb">cantidad de personas, y obtené al</text>
<text x="16" y="569.7" font-family="DM Sans" font-size="18.4" font-weight="400" fill="#f8f4eb">instante un precio estimado. Nosotros</text>
<text x="16" y="599.14" font-family="DM Sans" font-size="18.4" font-weight="400" fill="#f8f4eb">nos ocupamos del resto.</text>
<rect x="16" y="626.97" width="256.28" height="53.02" rx="8" fill="#b84a1b"/>
