<rect x="16" y="867.88" width="343" height="2" fill="#1f3d2f"/>
<text x="16" y="913.08" font-family="Fraunces" font-size="32" font-weight="400" fill="#b84a1b">1</text>
<text x="16" y="942.88" font-family="Fraunces" font-size="18.4" font-weight="500" fill="#1f3d2f">Armás tu pedido</text>
<text x="16" y="975.14" font-family="DM Sans" font-size="16" font-weight="400" fill="#1d2a23">Elegís uno o más menús y ves el precio</text>
<text x="16" y="1000.73" font-family="DM Sans" font-size="16" font-weight="400" fill="#1d2a23">estimado mientras completás los datos.</text>
<rect x="16" y="1044.33" width="343" height="2" fill="#1f3d2f"/>
