<text x="16" y="123" font-family="DM Sans" font-size="12.8" font-weight="700" fill="#f0b48f" letter-spacing="1.02">CATERING PARA EMPRESAS</text>
<text x="16" y="167.58" font-family="Fraunces" font-size="35.2" font-weight="500" fill="#ffffff">Tu próxima reunión,</text>
<text x="16" y="209.81" font-family="Fraunces" font-size="35.2" font-weight="500" fill="#ffffff">resuelta en un solo</text>
<text x="16" y="252.05" font-family="Fraunces" font-size="35.2" font-weight="500" fill="#ffffff">pedido.</text>
<text x="16" y="298.88" font-family="DM Sans" font-size="18.4" font-weight="400" fill="#f8f4eb">Elegí el menú, indicá la fecha y la</text>
<text x="16" y="328.31" font-family="DM Sans" font-size="18.4" font-weight="400" fill="#f8f4eb">cantidad de personas, y obtené al</text>
<text x="16" y="357.75" font-family="DM Sans" font-size="18.4" font-weight="400" fill="#f8f4eb">instante un precio estimado. Nosotros</text>
<text x="16" y="387.19" font-family="DM Sans" font-size="18.4" font-weight="400" fill="#f8f4eb">nos ocupamos del resto.</text>
<rect x="16" y="415.02" width="256.28" height="53.02" rx="8" fill="#b84a1b"/>
<text x="43.59" y="446.61" font-family="DM Sans" font-size="16.8" font-weight="700" fill="#ffffff">Obtener mi presupuesto</text>
