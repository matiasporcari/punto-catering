<text x="43.59" y="511.63" font-family="DM Sans" font-size="16.8" font-weight="700" fill="#1f3d2f">Ver el catálogo</text>
<text x="16" y="626.05" font-family="Fraunces" font-size="22.4" font-weight="500" fill="#1f3d2f">Cómo funciona</text>
<rect x="16" y="655.92" width="343" height="2" fill="#1f3d2f"/>
<text x="16" y="701.12" font-family="Fraunces" font-size="32" font-weight="400" fill="#b84a1b">1</text>
<text x="16" y="730.92" font-family="Fraunces" font-size="18.4" font-weight="500" fill="#1f3d2f">Armás tu pedido</text>
<text x="16" y="763.19" font-family="DM Sans" font-size="16" font-weight="400" fill="#1d2a23">Elegís uno o más menús y ves el precio</text>
<text x="16" y="788.78" font-family="DM Sans" font-size="16" font-weight="400" fill="#1d2a23">estimado mientras completás los datos.</text>
<rect x="16" y="832.38" width="343" height="2" fill="#1f3d2f"/>
<text x="16" y="877.58" font-family="Fraunces" font-size="32" font-weight="400" fill="#b84a1b">2</text>
<text x="16" y="907.38" font-family="Fraunces" font-size="18.4" font-weight="500" fill="#1f3d2f">Recibís el presupuesto</text>
<text x="16" y="939.64" font-family="DM Sans" font-size="16" font-weight="400" fill="#1d2a23">Revisamos el pedido y publicamos el precio</text>
<text x="16" y="965.23" font-family="DM Sans" font-size="16" font-weight="400" fill="#1d2a23">final en tu cuenta, listo para imprimir.</text>
<rect x="16" y="1008.83" width="343" height="2" fill="#1f3d2f"/>
<text x="16" y="1054.03" font-family="Fraunces" font-size="32" font-weight="400" fill="#b84a1b">3</text>
<text x="16" y="1083.83" font-family="Fraunces" font-size="18.4" font-weight="500" fill="#1f3d2f">Lo confirmás con un clic</text>
<text x="16" y="1116.09" font-family="DM Sans" font-size="16" font-weight="400" fill="#1d2a23">Aprobás desde tu cuenta y llegamos con todo</text>
<text x="16" y="1141.69" font-family="DM Sans" font-size="16" font-weight="400" fill="#1d2a23">preparado el día del evento.</text>
